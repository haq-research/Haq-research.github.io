<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t3 d3">
<title id="t3">The decision cascade inside one loop step</title>
<desc id="d3">State goes through guard code first, then Jev answers three questions in one parallel call, then the confidence band decides whether the runtime acts, confirms, or escalates to an LLM judge or a human.</desc>
<style>
text{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1f2328}
.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#57606a}.k{font-size:12px;font-weight:700;letter-spacing:.8px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}
</style>
<defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="1" y="1" width="958" height="698" rx="14" fill="#fbfbfb" stroke="#e1e4e8"/>

<!-- State -->
<rect x="300" y="28" width="360" height="78" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="480" y="56" text-anchor="middle" class="h">Workflow state S(t)</text>
<text x="480" y="80" text-anchor="middle" class="m">goal, evidence, iteration, cost,</text>
<text x="480" y="96" text-anchor="middle" class="m">tool_failures, last_output</text>

<!-- Guards -->
<rect x="300" y="146" width="360" height="78" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/>
<text x="316" y="172" class="k">1  GUARDS (CODE)</text>
<text x="316" y="196" class="s">iteration &lt; max, spend &lt; budget,</text>
<text x="316" y="214" class="s">output matches schema, action in scope</text>
<rect x="736" y="158" width="190" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<text x="831" y="182" text-anchor="middle" class="h">FAIL / ESCALATE</text>
<text x="831" y="201" text-anchor="middle" class="s">deterministic, no model</text>
<text x="690" y="178" text-anchor="middle" class="s">violated</text>

<!-- Jev -->
<rect x="140" y="266" width="680" height="150" rx="10" fill="#fdeced" stroke="#d71921" stroke-width="1.4"/>
<text x="160" y="292" class="k" style="fill:#d71921">2  ONE JEV CALL, QUESTIONS ANSWERED IN PARALLEL</text>
<rect x="160" y="306" width="200" height="94" rx="8" fill="#ffffff" stroke="#e8a4a7"/>
<text x="176" y="330" class="h">done</text>
<text x="176" y="350" class="s">Noul</text>
<text x="176" y="376" class="m">p = 0.31</text>
<rect x="380" y="306" width="200" height="94" rx="8" fill="#ffffff" stroke="#e8a4a7"/>
<text x="396" y="330" class="h">next_step</text>
<text x="396" y="350" class="s">Choice</text>
<text x="396" y="376" class="m">"retry", conf 0.62</text>
<rect x="600" y="306" width="200" height="94" rx="8" fill="#ffffff" stroke="#e8a4a7"/>
<text x="616" y="330" class="h">progress</text>
<text x="616" y="350" class="s">Score, 0 to 2</text>
<text x="616" y="376" class="m">1.4, conf 0.81</text>

<!-- Bands -->
<text x="194" y="456" class="k" style="fill:#57606a">3  CONFIDENCE BAND DECIDES WHO ACTS</text>
<rect x="32" y="472" width="280" height="110" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="48" y="498" class="h">above 0.9</text>
<text x="48" y="522" class="s">Runtime acts on the answer.</text>
<text x="48" y="540" class="s">Destructive actions still</text>
<text x="48" y="558" class="s">need a confirmation step.</text>
<rect x="340" y="472" width="280" height="110" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
<text x="356" y="498" class="h">0.5 to 0.9</text>
<text x="356" y="522" class="s">Act if the step is cheap to</text>
<text x="356" y="540" class="s">undo. Confirm or ask an LLM</text>
<text x="356" y="558" class="s">judge if it is not.</text>
<rect x="648" y="472" width="280" height="110" rx="10" fill="#f6f8fa" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="664" y="498" class="h">below 0.5</text>
<text x="664" y="522" class="s">Model reports real uncertainty.</text>
<text x="664" y="540" class="s">Escalate to an LLM judge or</text>
<text x="664" y="558" class="s">a human with the full state.</text>

<!-- Runtime -->
<rect x="250" y="622" width="460" height="56" rx="10" fill="#1f2328"/>
<text x="480" y="648" text-anchor="middle" class="h" style="fill:#ffffff">Runtime enforces the transition</text>
<text x="480" y="667" text-anchor="middle" class="s" style="fill:#d0d7de">CONTINUE  RETRY  SWITCH  ROUTE  ESCALATE  COMPLETE  FAIL</text>

<g stroke="#8c959f" stroke-width="1.6" fill="none">
<line x1="480" y1="106" x2="480" y2="143" marker-end="url(#c)"/>
<line x1="660" y1="185" x2="733" y2="185" marker-end="url(#c)"/>
<line x1="480" y1="224" x2="480" y2="263" marker-end="url(#c)"/>
<line x1="480" y1="416" x2="480" y2="430" />
<path d="M172,430 L788,430" />
<line x1="172" y1="430" x2="172" y2="469" marker-end="url(#c)"/>
<line x1="480" y1="430" x2="480" y2="469" marker-end="url(#c)"/>
<line x1="788" y1="430" x2="788" y2="469" marker-end="url(#c)"/>
<line x1="172" y1="582" x2="300" y2="619" marker-end="url(#c)"/>
<line x1="480" y1="582" x2="480" y2="619" marker-end="url(#c)"/>
<line x1="788" y1="582" x2="660" y2="619" marker-end="url(#c)"/>
</g>
<text x="492" y="250" class="s">pass</text>
</svg>
