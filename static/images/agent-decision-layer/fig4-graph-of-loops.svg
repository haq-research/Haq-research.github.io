<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t4 d4">
<title id="t4">A graph of loops driven by explicit transitions</title>
<desc id="d4">Planning routes to a RAG loop. Stalled progress switches to a web loop, then an API loop. Any loop can complete, escalate on low confidence, or fail when a guard is violated.</desc>
<style>
text{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1f2328}
.h{font-size:16px;font-weight:700}.s{font-size:12.5px;fill:#57606a}.t{font-size:11.5px;font-weight:700;letter-spacing:.6px;fill:#d71921}
</style>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d71921"/></marker>
</defs>
<rect x="1" y="1" width="958" height="468" rx="14" fill="#fbfbfb" stroke="#e1e4e8"/>
<text x="32" y="42" class="h" style="font-size:18px">From one loop to a graph of loops</text>
<text x="32" y="64" class="s" style="font-size:13.5px">Red edges are control plane decisions. SWITCH fires when progress stalls. The LLM works inside a node and never picks an edge.</text>

<!-- nodes -->
<rect x="32" y="190" width="130" height="64" rx="10" fill="#eef2f6" stroke="#475569" stroke-width="1.4"/>
<text x="97" y="227" text-anchor="middle" class="h">Plan</text>

<rect x="232" y="190" width="140" height="64" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="302" y="227" text-anchor="middle" class="h">RAG loop</text>
<rect x="432" y="190" width="140" height="64" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="502" y="227" text-anchor="middle" class="h">Web loop</text>
<rect x="632" y="190" width="140" height="64" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="702" y="227" text-anchor="middle" class="h">API loop</text>

<rect x="812" y="96" width="120" height="50" rx="25" fill="#1f2328"/>
<text x="872" y="126" text-anchor="middle" class="h" style="fill:#fff">COMPLETE</text>
<rect x="812" y="300" width="120" height="50" rx="25" fill="#ffffff" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="872" y="330" text-anchor="middle" class="h">ESCALATE</text>
<rect x="812" y="392" width="120" height="50" rx="25" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="872" y="422" text-anchor="middle" class="h">FAIL</text>

<!-- edges -->
<g stroke="#d71921" stroke-width="1.6" fill="none">
<line x1="162" y1="222" x2="229" y2="222" marker-end="url(#r)"/>
<line x1="372" y1="222" x2="429" y2="222" marker-end="url(#r)"/>
<line x1="572" y1="222" x2="629" y2="222" marker-end="url(#r)"/>
<!-- self loops -->
<path d="M282,254 C262,300 342,300 322,257" marker-end="url(#r)"/>
<path d="M482,254 C462,300 542,300 522,257" marker-end="url(#r)"/>
<path d="M682,254 C662,300 742,300 722,257" marker-end="url(#r)"/>
<!-- to complete -->
<path d="M302,190 C302,130 600,121 809,121" marker-end="url(#r)"/>
<path d="M502,190 C502,150 650,130 809,124" marker-end="url(#r)"/>
<path d="M702,190 C720,160 760,140 809,128" marker-end="url(#r)"/>
<!-- to escalate -->
<path d="M772,232 C795,260 800,300 809,318" marker-end="url(#r)"/>
</g>
<g stroke="#8c959f" stroke-width="1.4" fill="none" stroke-dasharray="4 4">
<path d="M302,300 L302,417 L809,417" marker-end="url(#g)"/>
<line x1="502" y1="300" x2="502" y2="417"/>
<line x1="702" y1="300" x2="702" y2="417"/>
</g>

<text x="196" y="212" text-anchor="middle" class="t">ROUTE</text>
<text x="401" y="212" text-anchor="middle" class="t">SWITCH</text>
<text x="601" y="212" text-anchor="middle" class="t">SWITCH</text>
<text x="302" y="318" text-anchor="middle" class="t">CONTINUE / RETRY</text>
<text x="502" y="318" text-anchor="middle" class="t">CONTINUE / RETRY</text>
<text x="702" y="318" text-anchor="middle" class="t">CONTINUE / RETRY</text>
<text x="560" y="100" text-anchor="middle" class="t">COMPLETE</text>
<text x="812" y="284" class="s">confidence &lt; 0.5</text>
<text x="560" y="438" text-anchor="middle" class="s">guard violated in any loop: budget, iteration cap, scope</text>
</svg>
